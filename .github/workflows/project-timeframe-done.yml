name: Project timeframe done

on:
  issues:
    types: [closed]

permissions: {}

# The IDs belong to project 12 (Crosslink), its Timeframe field and that field's "Done" option.
# Deleting and recreating the field or the option changes its ID, and this then fails.
env:
  PROJECT_ID: PVT_kwDOB2JXZM4Bl0RE
  FIELD_ID: PVTSSF_lADOB2JXZM4Bl0REzhkfrV8
  OPTION_ID: 56b79a9e

jobs:
  set-timeframe:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          item=$(gh api graphql -f id="$ISSUE_ID" -f project="$PROJECT_ID" \
            -f query='query($id: ID!) { node(id: $id) { ... on Issue { projectItems(first: 20) { nodes { id project { id } } } } } }' \
            --jq '.data.node.projectItems.nodes[] | select(.project.id == env.PROJECT_ID) | .id')
          if [ -z "$item" ]; then exit 0; fi
          gh api graphql --silent -f project="$PROJECT_ID" -f item="$item" -f field="$FIELD_ID" -f option="$OPTION_ID" \
            -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) { updateProjectV2ItemFieldValue(input: { projectId: $project, itemId: $item, fieldId: $field, value: { singleSelectOptionId: $option } }) { clientMutationId } }'
